name: airflow_automation

# ★ 이 compose 파일은 Airflow만 새로 띄운다.
#   k3s 클러스터/MinIO/Spark 실습 코드는 전부 02(spark_on_kubernetes_cluster)가 이미 띄워둔 것을 그대로 재사용한다.
#   그래서 02/docker-compose.yml이 먼저 `docker compose up` 되어 있어야 하고(같은 네트워크/볼륨을 external로 참조),
#   여기서는 k3s나 MinIO 컨테이너를 다시 정의하지 않는다.

services:
  # 02가 만든 k3s kubeconfig(volume: spark_on_kubernetes_cluster_k8s-config)는
  # server 주소가 "https://127.0.0.1:6443"(k3s 컨테이너 자기 자신 기준)로 박혀 있어서
  # 다른 컨테이너(Airflow)에서는 그대로 못 씀 — 02/start.md에서 호스트로 꺼낼 때 겪었던 문제와 동일한 종류.
  # docker 네트워크 안에서는 컨테이너명 "k8s-master-node"로 접근 가능하므로 그걸로 치환하고,
  # 그 이름에 대한 SAN이 인증서에 없어서 insecure-skip-tls-verify로 검증을 끈 사본을 만들어 공유 볼륨에 저장.
  kubeconfig-prep:
    image: alpine:3.20
    container_name: airflow-kubeconfig-prep
    volumes:
      - k8s-config-src:/src:ro
      - kube-config:/dst
    command:
      - sh
      - -c
      - |
        set -e
        sed 's#127.0.0.1#k8s-master-node#' /src/k3s.yaml | sed '/certificate-authority-data/d' | sed 's#server: https://k8s-master-node:6443#server: https://k8s-master-node:6443\n    insecure-skip-tls-verify: true#' > /dst/config
        echo 'kubeconfig 준비 완료'
        cat /dst/config

  # 계정을 standalone이 무작위로 만들게 두지 않고 원하는 아이디/비번으로 고정하기 위한 1회성 초기화.
  # 공식 Airflow docker-compose 예제의 airflow-init 패턴과 동일 — DB 마이그레이션 + 계정 생성을 먼저 끝내두면,
  # 뒤에 뜨는 standalone은 "이미 계정이 있다"고 보고 자기 몫의 무작위 admin 계정을 또 만들지 않는다.
  # 아이디/비번을 바꾸고 싶으면 03/ 밑에 .env 파일을 만들어 _AIRFLOW_WWW_USER_USERNAME / _AIRFLOW_WWW_USER_PASSWORD를
  # 지정하면 됨(안 만들면 기본값 airflow/airflow — 공식 quick-start 기본값과 동일, 로컬 학습용이라 그대로 둬도 무방).
  airflow-init:
    image: apache/airflow:2.10.3-python3.11
    container_name: airflow-init
    depends_on:
      kubeconfig-prep:
        condition: service_completed_successfully
    mem_limit: 1g
    environment:
      - _AIRFLOW_WWW_USER_USERNAME=${_AIRFLOW_WWW_USER_USERNAME:-airflow}
      - _AIRFLOW_WWW_USER_PASSWORD=${_AIRFLOW_WWW_USER_PASSWORD:-airflow}
    volumes:
      - airflow-data:/opt/airflow
    entrypoint: /bin/bash
    command:
      - -c
      - |
        airflow db migrate
        # "airflow users create"는 계정이 이미 있으면 "already exist in the db"만 찍고 exit 0으로 끝남(실패가 아님).
        # 그래서 create 성공 여부와 상관없이 매번 reset-password로 비밀번호를 .env 값과 강제로 맞춘다(멱등성 보장).
        airflow users create \
          --username "$$_AIRFLOW_WWW_USER_USERNAME" \
          --password "$$_AIRFLOW_WWW_USER_PASSWORD" \
          --firstname Admin --lastname User --role Admin \
          --email "$$_AIRFLOW_WWW_USER_USERNAME@example.com" \
        || true
        airflow users reset-password \
          --username "$$_AIRFLOW_WWW_USER_USERNAME" \
          --password "$$_AIRFLOW_WWW_USER_PASSWORD"

  airflow:
    image: apache/airflow:2.10.3-python3.11
    container_name: airflow-standalone
    depends_on:
      kubeconfig-prep:
        condition: service_completed_successfully
      airflow-init:
        condition: service_completed_successfully
    mem_limit: 2g
    ports:
      - "8090:8080"   # 웹 UI. 02의 9999/6443/9000/9001과 안 겹치게, 8081은 호스트에서 이미 사용 중이라 8090 사용
    environment:
      - AIRFLOW__CORE__LOAD_EXAMPLES=false
      # KubernetesPodOperator를 쓰려면 이 provider가 필요한데 기본 이미지엔 없음.
      # jupyter-client가 시작할 때 pyspark를 pip install하던 것과 같은 방식(간단하지만 컨테이너 재생성될 때마다 재설치됨).
      - _PIP_ADDITIONAL_REQUIREMENTS=apache-airflow-providers-cncf-kubernetes
      # DAG(medallion_pipeline.py)의 ingest 태스크가 os.environ에서 읽어서, 자기가 만드는 k8s 팟에 다시 주입함.
      # .env에 값 채워넣기만 하면 됨 — DAG 코드에는 credential을 직접 적지 않는다.
      - KAGGLE_USERNAME=${KAGGLE_USERNAME}
      - KAGGLE_KEY=${KAGGLE_KEY}
    volumes:
      - ./dags:/opt/airflow/dags
      - airflow-data:/opt/airflow          # DB(sqlite), 로그 등 영속화
      - kube-config:/opt/airflow/kube:ro   # kubeconfig-prep이 만든 kubeconfig
    command: standalone   # webserver+scheduler+triggerer를 한 프로세스로. sqlite+SequentialExecutor라 가볍게 학습하기에 적합
    restart: unless-stopped

networks:
  default:
    name: spark_on_kubernetes_cluster_default   # 02가 만든 네트워크에 합류 (minio-storage, k8s-master-node를 이름으로 접근하기 위함)
    external: true

volumes:
  airflow-data:
  kube-config:
  k8s-config-src:
    external: true
    name: spark_on_kubernetes_cluster_k8s-config   # 02의 volumes.k8s-config를 읽기 전용으로 공유받음
