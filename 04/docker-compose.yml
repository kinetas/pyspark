name: lakehouse_query

# 04: Gold 레이어를 실무형 쿼리 엔진(Trino) + BI 도구(Superset)로 조회하는 스택.
# 02(k3s+MinIO)가 먼저 떠 있어야 하고, 그 네트워크(spark_on_kubernetes_cluster_default)에 합류해서
# MinIO를 컨테이너명(minio-storage)으로 바로 찾는다. 03의 K8s 팟과 달리 이건 순수 도커 컨테이너들이라
# IP를 몰라도 됨 — 03에서 겪은 "IP 하드코딩이 실제 IP와 어긋나는" 문제가 애초에 발생하지 않는 구조.

services:
  # Hive Metastore가 S3A(MinIO)에 접속하려면 hadoop-aws/aws-sdk jar가 필요한데 기본 이미지엔 없어서
  # (History Server 때와 같은 방식으로) 별도 컨테이너로 미리 받아 공유 볼륨에 둔다.
  hive-metastore-jars-init:
    image: alpine:3.20
    container_name: hive-metastore-jars-init
    volumes:
      - hive-auxlib:/auxlib
    command:
      - sh
      - -c
      - |
        set -e
        apk add --no-cache curl
        rm -f /auxlib/*.jar
        # hive-metastore(apache/hive:4.1.0) 이미지에 내장된 hadoop-common이 3.4.1이라, hadoop-aws도 3.4.1로 정확히 맞춰야 함.
        # Hadoop 3.4.x부터 S3A가 AWS SDK v1(aws-java-sdk-bundle) 대신 v2(software.amazon.awssdk:bundle)를 씀
        # — 정확한 짝(2.24.6)은 hadoop-project:3.4.1 pom의 aws-java-sdk-v2.version에서 확인함.
        curl -sL -o /auxlib/hadoop-aws-3.4.1.jar https://repo1.maven.org/maven2/org/apache/hadoop/hadoop-aws/3.4.1/hadoop-aws-3.4.1.jar
        curl -sL -o /auxlib/bundle-2.24.6.jar https://repo1.maven.org/maven2/software/amazon/awssdk/bundle/2.24.6/bundle-2.24.6.jar
        echo 'jar 준비 완료'

  # 메타데이터(스키마/테이블 위치) 저장소. Gold parquet 폴더를 SQL 테이블로 등록해두는 카탈로그 역할.
  # 학습 규모라 내장 Derby DB 사용(별도 Postgres 컨테이너 없음 — 개인 프로젝트에서는 DB_DRIVER=postgres로 교체 예정).
  hive-metastore:
    image: apache/hive:4.1.0
    container_name: hive-metastore
    depends_on:
      hive-metastore-jars-init:
        condition: service_completed_successfully
    environment:
      - SERVICE_NAME=metastore
      - HIVE_AUX_JARS_PATH=/opt/hive/auxlib
    volumes:
      - hive-auxlib:/opt/hive/auxlib:ro
      # HIVE_CUSTOM_CONF_DIR 메커니즘은 이 이미지(RHEL UBI 기반)에 find가 없어서 심볼릭 링크 생성이
      # 조용히 실패함(entrypoint.sh: find: command not found) — 대신 conf 디렉토리에 직접 마운트.
      - ./metastore-conf/core-site.xml:/opt/hive/conf/core-site.xml:ro
      - hive-metastore-data:/opt/hive/data
    ports:
      - "9083:9083"
    mem_limit: 1.5g
    restart: unless-stopped

  # Hive Metastore에 스키마를 물어보고, 실제 데이터는 MinIO에서 직접 읽어 쿼리를 실행하는 SQL 엔진.
  # coordinator 혼자 worker 역할까지 겸함(node-scheduler.include-coordinator=true) — 별도 worker 컨테이너 없음.
  trino:
    image: trinodb/trino:latest
    container_name: trino
    depends_on:
      - hive-metastore
    volumes:
      - ./trino/etc:/etc/trino:ro
    ports:
      - "8091:8080"   # 03(Airflow)이 8090을 쓰고 있어서 8091
    mem_limit: 2g
    restart: unless-stopped

  # BI 대시보드. Trino를 SQL 데이터소스로 연결해서 Gold 테이블을 시각화.
  superset:
    image: apache/superset:latest
    container_name: superset
    depends_on:
      - trino
    environment:
      - SUPERSET_SECRET_KEY=${SUPERSET_SECRET_KEY:-change_this_to_a_random_value}
      # pip install이 venv에 쓰기 권한이 없어 user-site(~/.local)로 떨어지는데, 이 인터프리터가
      # user-site를 자동으로 sys.path에 안 넣어서 명시적으로 추가해야 trino 드라이버를 찾음.
      - PYTHONPATH=/app/pythonpath:/app/superset_home/.local/lib/python3.10/site-packages
    ports:
      - "8889:8088"   # 02(9999)/03(8090)과 안 겹치게
    volumes:
      - superset-data:/app/superset_home
      - ./superset_config.py:/app/pythonpath/superset_config.py:ro
      - ./superset-bootstrap.sh:/app/superset-bootstrap.sh:ro
    entrypoint: ["/bin/bash", "/app/superset-bootstrap.sh"]
    mem_limit: 1.5g
    restart: unless-stopped

networks:
  default:
    name: spark_on_kubernetes_cluster_default   # 02가 만든 네트워크에 합류 (minio-storage를 이름으로 접근하기 위함)
    external: true

volumes:
  hive-auxlib:
  hive-metastore-data:
  superset-data:
